<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Live Wire logo">
  <defs>
    <linearGradient id="pulse" x1="64" y1="0" x2="448" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D9E75"/>
      <stop offset="0.5" stop-color="#EF9F27"/>
      <stop offset="1" stop-color="#E24B4A"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#0E1117"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#1E242E" stroke-width="2"/>
  <!-- broadcast arcs radiating from the live blip -->
  <g fill="none" stroke="#E24B4A" stroke-linecap="round" opacity="0.85">
    <path d="M150 196 A78 78 0 0 0 150 332" stroke-width="14" opacity="0.5"/>
    <path d="M120 166 A120 120 0 0 0 120 362" stroke-width="12" opacity="0.28"/>
    <path d="M362 196 A78 78 0 0 1 362 332" stroke-width="14" opacity="0.5"/>
    <path d="M392 166 A120 120 0 0 1 392 362" stroke-width="12" opacity="0.28"/>
  </g>
  <!-- waveform -->
  <line x1="86" y1="264" x2="426" y2="264" stroke="#2A3039" stroke-width="4" stroke-linecap="round"/>
  <path d="M92 264 L150 264 L176 264 L196 290 L214 150 L240 360 L264 222 L288 264 L420 264"
        fill="none" stroke="url(#pulse)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- live blip -->
  <circle cx="256" cy="264" r="20" fill="#E24B4A"/>
  <circle cx="256" cy="264" r="20" fill="none" stroke="#0E1117" stroke-width="5"/>
</svg>
